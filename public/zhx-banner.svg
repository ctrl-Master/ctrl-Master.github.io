<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3f7"/>
      <stop offset="0.5" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#dde6ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfe0ee"/>
      <stop offset="1" stop-color="#eef3f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 淡色背景 -->
  <rect width="1200" height="600" fill="url(#bg)"/>
  <circle cx="600" cy="300" r="320" fill="url(#glow)"/>

  <!-- 中枢网络（nexus 概念） -->
  <g stroke="#a9c4da" stroke-width="1.5" opacity="0.7">
    <line x1="600" y1="300" x2="380" y2="160"/>
    <line x1="600" y1="300" x2="820" y2="160"/>
    <line x1="600" y1="300" x2="340" y2="430"/>
    <line x1="600" y1="300" x2="860" y2="430"/>
    <line x1="600" y1="300" x2="600" y2="120"/>
    <line x1="600" y1="300" x2="600" y2="480"/>
    <line x1="380" y1="160" x2="820" y2="160"/>
    <line x1="340" y1="430" x2="860" y2="430"/>
  </g>
  <g fill="#7ba3c9">
    <circle cx="600" cy="300" r="12"/>
    <circle cx="380" cy="160" r="7"/>
    <circle cx="820" cy="160" r="7"/>
    <circle cx="340" cy="430" r="7"/>
    <circle cx="860" cy="430" r="7"/>
    <circle cx="600" cy="120" r="7"/>
    <circle cx="600" cy="480" r="7"/>
  </g>

  <!-- 文字 -->
  <g text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="600" y="540" font-size="48" font-weight="700" fill="#3a5068" letter-spacing="3">ZHX NEXUS Studio</text>
    <text x="600" y="575" font-size="18" font-weight="400" fill="#8aa1b5" letter-spacing="8">SYSTEMS INTEGRATION</text>
  </g>
</svg>
