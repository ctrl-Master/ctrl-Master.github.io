<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3f7"/>
      <stop offset="1" stop-color="#e2e9f0"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a5068"/>
      <stop offset="1" stop-color="#5b7c99"/>
    </linearGradient>
  </defs>

  <!-- 左侧图标徽标 -->
  <g transform="translate(20,40)">
    <rect x="0" y="0" width="120" height="120" rx="26" fill="url(#bg)"/>
    <g fill="none" stroke="url(#stroke)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 28 H60 L30 78 H60"/>
      <path d="M70 28 V78 M70 53 H92 M92 28 V78"/>
    </g>
    <g fill="#7ba3c9">
      <circle cx="30" cy="28" r="5"/>
      <circle cx="60" cy="78" r="5"/>
      <circle cx="70" cy="53" r="5"/>
      <circle cx="92" cy="28" r="5"/>
    </g>
    <g stroke="#9bbdd9" stroke-width="1.5" opacity="0.6">
      <line x1="30" y1="28" x2="70" y2="53"/>
      <line x1="60" y1="78" x2="92" y2="28"/>
    </g>
  </g>

  <!-- 文字 -->
  <g transform="translate(170,0)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="0" y="92" font-size="46" font-weight="700" fill="#3a5068" letter-spacing="2">ZHX</text>
    <text x="118" y="92" font-size="46" font-weight="300" fill="#5b7c99" letter-spacing="1.5">NEXUS</text>
    <text x="0" y="128" font-size="20" font-weight="400" fill="#8aa1b5" letter-spacing="6">STUDIO</text>
  </g>
</svg>
