<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e85d04"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
  </defs>

  <!-- 圆角暖色底板 -->
  <rect x="20" y="20" width="360" height="360" rx="64" fill="url(#bg)"/>

  <!-- ZHX 几何线条 -->
  <g fill="none" stroke="url(#stroke)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- Z -->
    <path d="M120 110 H190 L120 200 H190"/>
    <!-- H -->
    <path d="M205 110 V200 M205 155 H255 M255 110 V200"/>
    <!-- X -->
    <path d="M300 110 L335 200 M335 110 L300 200"/>
  </g>

  <!-- 连接节点（nexus 概念，暖橙） -->
  <g fill="#fb923c">
    <circle cx="120" cy="110" r="7"/>
    <circle cx="190" cy="200" r="7"/>
    <circle cx="205" cy="155" r="7"/>
    <circle cx="255" cy="110" r="7"/>
    <circle cx="335" cy="200" r="7"/>
    <circle cx="300" cy="110" r="7"/>
  </g>
  <g stroke="#fdba74" stroke-width="2" opacity="0.6">
    <line x1="120" y1="110" x2="205" y2="155"/>
    <line x1="190" y1="200" x2="255" y2="110"/>
    <line x1="205" y1="155" x2="335" y2="200"/>
  </g>
</svg>
